name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - name: Run tests with coverage
        env:
          TypeSafeApiKey: ${{ secrets.TYPESAFE_API_KEY }}
          RUN_LIVE_TESTS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          if [ "$RUN_LIVE_TESTS" = "true" ]; then
            dotnet test tests/JevDotNet.Tests/JevDotNet.Tests.csproj --configuration Release --no-build --no-restore -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=coverage/ -p:Include='[JevDotNet]*'
          else
            dotnet test tests/JevDotNet.Tests/JevDotNet.Tests.csproj --configuration Release --no-build --no-restore --filter 'Category!=Live' -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=coverage/ -p:Include='[JevDotNet]*'
          fi

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: tests/JevDotNet.Tests/coverage/coverage.cobertura.xml
          format: cobertura

      - run: dotnet pack src/JevDotNet/JevDotNet.csproj --configuration Release --no-build --output artifacts

      - name: Upload package
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: artifacts/*.*nupkg

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v5
        with:
          name: nuget-package
          path: artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
